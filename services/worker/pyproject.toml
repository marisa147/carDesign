[project]
name = "caragent-worker"
version = "0.1.0"
description = "Celery work-plane foundation for carAgent."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery==5.6.3",
  "pydantic==2.13.1",
  "pydantic-settings==2.14.0",
  "redis==7.4.0",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==9.0.3",
  "ruff==0.15.12",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caragent_worker"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["src", "tests"]
