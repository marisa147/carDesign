[project]
name = "caragent-api"
version = "0.1.0"
description = "FastAPI control-plane foundation for the carAgent workbench."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.136.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.0",
  "uvicorn[standard]==0.42.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.0",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.9",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caragent_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
