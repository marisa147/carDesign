[project]
name = "caragent-core"
version = "0.1.0"
description = "Shared durable data primitives for the carAgent API and worker."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "pydantic>=2.13,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caragent_core"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["src", "tests"]
