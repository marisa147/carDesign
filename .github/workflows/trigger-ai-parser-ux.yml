name: Apply AI parser implementation

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-ai-parser-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Execute embedded source patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          import traceback

          try:
              workflow = Path(".github/workflows/apply-ai-parser-ux.yml").read_text(encoding="utf-8")
              marker = "      - name: Apply source changes\n"
              start = workflow.index(marker)
              run_marker = "        run: |\n"
              script_start = workflow.index(run_marker, start) + len(run_marker)
              next_step = workflow.index("\n      - uses: actions/setup-node", script_start)
              embedded = textwrap.dedent(workflow[script_start:next_step])
              tolerant_replace = '''def replace(path: str, old: str, new: str) -> None:
                  target = Path(path)
                  text = target.read_text(encoding="utf-8")
                  if old not in text:
                      old_lines = old.splitlines(keepends=True)
                      new_lines = new.splitlines(keepends=True)
                      matched = None
                      replacement = new
                      for amount in range(1, 13):
                          candidates = []
                          if old_lines:
                              candidates.append((
                                  old_lines[0] + "".join(
                                      line[amount:] if line.startswith(" " * amount) else line
                                      for line in old_lines[1:]
                                  ),
                                  new_lines[0] + "".join(
                                      line[amount:] if line.startswith(" " * amount) else line
                                      for line in new_lines[1:]
                                  ) if new_lines else new,
                              ))
                          candidates.append((
                              "".join(
                                  line[amount:] if line.startswith(" " * amount) else line
                                  for line in old_lines
                              ),
                              "".join(
                                  line[amount:] if line.startswith(" " * amount) else line
                                  for line in new_lines
                              ),
                          ))
                          for candidate, candidate_new in candidates:
                              if candidate in text:
                                  matched = candidate
                                  replacement = candidate_new
                                  break
                          if matched is not None:
                              break
                      if matched is None:
                          raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
                      old = matched
                      new = replacement
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
              '''
              helper_start = embedded.index("def replace(path: str, old: str, new: str) -> None:")
              helper_end = embedded.index("\ngeneration =", helper_start)
              embedded = embedded[:helper_end] + "\n\n" + tolerant_replace + "\n" + embedded[helper_end + 1 :]
              Path("embedded-patch.py").write_text(embedded, encoding="utf-8")
              exec(compile(embedded, "apply-ai-parser-ux.yml", "exec"), {})
          except BaseException:
              detail = traceback.format_exc()
              Path("automation-error.txt").write_text(detail, encoding="utf-8")
              print(detail)
              raise

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-parser-patch-error
          path: |
            automation-error.txt
            embedded-patch.py
          retention-days: 1

      - name: Restore temporary workflow files
        if: always()
        run: |
          git checkout -- .github/workflows/apply-ai-parser-ux.yml || true
          git checkout -- .github/workflows/source-snapshot.yml || true
          git checkout -- .github/workflows/trigger-ai-parser-ux.yml || true
          rm -f automation-error.txt embedded-patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.0.8 --activate
          pnpm install --frozen-lockfile
          (cd services/core && uv sync --dev --locked)
          (cd services/api && uv sync --dev --locked)
          (cd services/worker && uv sync --dev --locked)

      - name: Refresh generated contracts
        run: pnpm contracts:generate

      - name: Validate repository
        run: pnpm validate

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "add AI brief parser UX and fallback trace"
          git push
