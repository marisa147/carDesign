name: Trigger AI parser implementation

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-ai-parser-ux.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const path = '.github/workflows/apply-ai-parser-ux.yml';
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch,
            });
            const source = Buffer.from(current.data.content, 'base64').toString('utf8');
            const updated = source.includes('workflow_dispatch:')
              ? source
              : source.replace('on:\n  push:', 'on:\n  workflow_dispatch:\n  push:');
            if (updated !== source) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch,
                message: 'enable AI parser workflow dispatch',
                sha: current.data.sha,
                content: Buffer.from(updated).toString('base64'),
              });
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'apply-ai-parser-ux.yml',
              ref: branch,
            });
