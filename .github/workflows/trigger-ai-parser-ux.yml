name: Apply AI parser implementation

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-ai-parser-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Execute embedded source patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          import traceback

          try:
              workflow = Path(".github/workflows/apply-ai-parser-ux.yml").read_text(encoding="utf-8")
              marker = "      - name: Apply source changes\n"
              start = workflow.index(marker)
              run_marker = "        run: |\n"
              script_start = workflow.index(run_marker, start) + len(run_marker)
              next_step = workflow.index("\n      - uses: actions/setup-node", script_start)
              embedded = textwrap.dedent(workflow[script_start:next_step])
              exec(compile(embedded, "apply-ai-parser-ux.yml", "exec"), {})
          except BaseException:
              detail = traceback.format_exc()
              Path("automation-error.txt").write_text(detail, encoding="utf-8")
              print(detail)
              raise

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-parser-patch-error
          path: automation-error.txt
          retention-days: 1

      - name: Restore temporary workflow files
        if: always()
        run: |
          git checkout -- .github/workflows/apply-ai-parser-ux.yml || true
          git checkout -- .github/workflows/source-snapshot.yml || true
          git checkout -- .github/workflows/trigger-ai-parser-ux.yml || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.0.8 --activate
          pnpm install --frozen-lockfile
          (cd services/core && uv sync --dev --locked)
          (cd services/api && uv sync --dev --locked)
          (cd services/worker && uv sync --dev --locked)

      - name: Refresh generated contracts
        run: pnpm contracts:generate

      - name: Validate repository
        run: pnpm validate

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "add AI brief parser UX and fallback trace"
          git push
