name: Trigger AI parser implementation

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-ai-parser-ux.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'apply-ai-parser-ux.yml',
              ref: context.payload.pull_request.head.ref,
            });
