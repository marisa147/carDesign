name: Source snapshot

on:
  push:
    paths:
      - ".github/workflows/source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: car-design-source
          path: .
          include-hidden-files: true
          retention-days: 1
