name: Source snapshot

on:
  push:
    branches:
      - codex/ai-brief-parser-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai-brief-parser-ux
      - uses: actions/upload-artifact@v4
        with:
          name: car-design-source
          path: .
          include-hidden-files: true
          retention-days: 1
