name: Apply AI brief parser UX

on:
  push:
    paths:
      - ".github/workflows/apply-ai-parser-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          generation = "services/api/src/caragent_api/routes/generation.py"
          replace(
              generation,
              "    BriefParserInput,\n    GenerationBriefPayload,",
              "    BriefParserInput,\n    BriefParserTrace,\n    GenerationBriefPayload,",
          )
          replace(
              generation,
              "    GenerationBriefCreateRequest,\n    GenerationBriefResponse,",
              "    GenerationBriefCreateRequest,\n    GenerationBriefFieldChange,\n    GenerationBriefParseRequest,\n    GenerationBriefParseResponse,\n    GenerationBriefResponse,",
          )
          replace(
              generation,
              'LOCAL_PROVIDER_NAMES = {"local", LOCAL_PROVIDER}\n',
              'LOCAL_PROVIDER_NAMES = {"local", LOCAL_PROVIDER}\nBRIEF_DIFF_FIELDS = (\n'
              '    "vehicle_template_id",\n'
              '    "view",\n'
              '    "character_theme",\n'
              '    "character_focus",\n'
              '    "style",\n'
              '    "palette",\n'
              '    "text",\n'
              '    "supporting_graphics",\n'
              '    "racing_cues",\n'
              '    "typography_intent",\n'
              '    "color_harmony",\n'
              '    "coverage",\n'
              ')\n',
          )
          create_marker = '''@router.post(
              "/workspaces/{workspace_id}/generation/briefs",
              response_model=GenerationBriefResponse,
              status_code=status.HTTP_201_CREATED,
          )'''
          parse_route = '''@router.post(
              "/generation/briefs/parse",
              response_model=GenerationBriefParseResponse,
          )
          async def parse_generation_brief_route(
              payload: GenerationBriefParseRequest,
              request: Request,
              _current_user: CurrentUserDependency,
          ) -> GenerationBriefParseResponse:
              parser_input = _brief_parser_input(payload)
              baseline = create_generation_brief_from_draft(
                  BriefDraft.model_validate(parser_input),
                  parser_trace=BriefParserTrace(
                      requested_mode="deterministic",
                      provider="deterministic",
                  ),
              )
              try:
                  parsed = await _parse_brief_payload(
                      parser_input,
                      request,
                      requested_mode=payload.parser_mode,
                      allow_fallback=payload.allow_fallback,
                  )
              except ValueError as error:
                  raise generation_validation_failed(error) from error
              return GenerationBriefParseResponse(
                  changes=_brief_field_changes(baseline, parsed),
                  payload=parsed,
                  trace=parsed.parser_trace,
              )


          ''' + create_marker
          replace(generation, create_marker, parse_route)

          old_helper = '''async def _brief_payload_from_create_request(
              payload: GenerationBriefCreateRequest,
              request: Request,
          ) -> GenerationBriefPayload:
              settings = _settings_from_request(request)
              parser_input = _brief_parser_input(payload)
              if settings.ai_brief_parser_provider.strip().lower() in OPENAI_ALIASES:
                  parser_client = getattr(request.app.state, "openai_brief_parser_client", None)
                  draft = await parse_openai_brief(
                      parser_input,
                      client=parser_client,
                      settings=settings,
                  )
                  return create_generation_brief_from_draft(draft)

              return create_generation_brief_from_draft(BriefDraft.model_validate(parser_input))
          '''
          new_helper = '''async def _brief_payload_from_create_request(
              payload: GenerationBriefCreateRequest,
              request: Request,
          ) -> GenerationBriefPayload:
              settings = _settings_from_request(request)
              requested_mode = (
                  "ai"
                  if settings.ai_brief_parser_provider.strip().lower() in OPENAI_ALIASES
                  else "deterministic"
              )
              return await _parse_brief_payload(
                  _brief_parser_input(payload),
                  request,
                  requested_mode=requested_mode,
                  allow_fallback=settings.ai_brief_parser_fallback_enabled,
              )


          async def _parse_brief_payload(
              parser_input: BriefParserInput,
              request: Request,
              *,
              requested_mode: str,
              allow_fallback: bool,
          ) -> GenerationBriefPayload:
              if requested_mode == "deterministic":
                  return create_generation_brief_from_draft(
                      BriefDraft.model_validate(parser_input),
                      parser_trace=BriefParserTrace(
                          requested_mode="deterministic",
                          provider="deterministic",
                      ),
                  )
              if requested_mode != "ai":
                  raise ValueError(f"Unsupported brief parser mode: {requested_mode}")

              settings = _settings_from_request(request)
              unavailable_reason = _ai_parser_unavailable_reason(settings)
              if unavailable_reason is not None:
                  return _fallback_or_raise(
                      parser_input,
                      reason=unavailable_reason,
                      allow_fallback=allow_fallback,
                  )

              parser_client = getattr(request.app.state, "openai_brief_parser_client", None)
              try:
                  draft = await parse_openai_brief(
                      parser_input,
                      client=parser_client,
                      settings=settings,
                  )
              except ValueError as error:
                  return _fallback_or_raise(
                      parser_input,
                      reason=str(error),
                      allow_fallback=allow_fallback,
                  )

              return create_generation_brief_from_draft(
                  draft,
                  parser_trace=BriefParserTrace(
                      requested_mode="ai",
                      provider="openai",
                      model=settings.ai_provider_openai_text_model,
                  ),
              )


          def _fallback_or_raise(
              parser_input: BriefParserInput,
              *,
              reason: str,
              allow_fallback: bool,
          ) -> GenerationBriefPayload:
              normalized_reason = " ".join(reason.split())[:500]
              if not allow_fallback:
                  raise ValueError(normalized_reason)
              return create_generation_brief_from_draft(
                  BriefDraft.model_validate(parser_input),
                  parser_trace=BriefParserTrace(
                      requested_mode="ai",
                      provider="deterministic",
                      status="fallback",
                      fallback_reason=normalized_reason,
                  ),
              )


          def _ai_parser_unavailable_reason(settings: ApiSettings) -> str | None:
              if not settings.ai_provider_calls_enabled:
                  return "AI_PROVIDER_CALLS_ENABLED is disabled."
              api_key = settings.ai_provider_openai_api_key
              if api_key is None or not api_key.get_secret_value():
                  return "AI_PROVIDER_OPENAI_API_KEY is missing."
              return None


          def _brief_field_changes(
              before: GenerationBriefPayload,
              after: GenerationBriefPayload,
          ) -> list[GenerationBriefFieldChange]:
              before_payload = before.model_dump(mode="json")
              after_payload = after.model_dump(mode="json")
              return [
                  GenerationBriefFieldChange(
                      field=field,
                      before=before_payload.get(field),
                      after=after_payload.get(field),
                  )
                  for field in BRIEF_DIFF_FIELDS
                  if before_payload.get(field) != after_payload.get(field)
              ]
          '''
          replace(generation, old_helper, new_helper)

          generation_api = "apps/web/src/lib/api/generation.ts"
          replace(
              generation_api,
              "  type GenerationBriefCreateRequest,\n  type GenerationBriefResponse,",
              "  type GenerationBriefCreateRequest,\n  type GenerationBriefParseRequest,\n  type GenerationBriefParseResponse,\n  type GenerationBriefResponse,",
          )
          replace(
              generation_api,
              '''export async function updateGenerationBrief(
          ''',
              '''export async function parseGenerationBrief(
              payload: GenerationBriefParseRequest,
              options: GenerationApiOptions = {},
          ): Promise<GenerationBriefParseResponse> {
              return requestGenerationJson<GenerationBriefParseResponse>(
                  "/generation/briefs/parse",
                  "POST",
                  payload,
                  options,
              );
          }

          export async function updateGenerationBrief(
          ''',
          )

          panel = "apps/web/src/components/workbench/parameter-panel.tsx"
          replace(
              panel,
              "  GenerationBriefPayload,\n  GenerationBriefResponse,",
              "  GenerationBriefParseRequest,\n  GenerationBriefParseResponse,\n  GenerationBriefPayload,\n  GenerationBriefResponse,",
          )
          replace(
              panel,
              '''  REFERENCE_ROLE_OPTIONS,
              buildReferenceUsagePayload,
              type ReferenceUsageDraft,
          } from "@/lib/api/generation";''',
              '''  REFERENCE_ROLE_OPTIONS,
              buildReferenceUsagePayload,
              parseGenerationBrief,
              type ReferenceUsageDraft,
          } from "@/lib/api/generation";''',
          )
          replace(
              panel,
              '''  const [archiveState, setArchiveState] = useState<SaveState>("idle");
              const [referenceAssetIdsTextTouched, setReferenceAssetIdsTextTouched] = useState(false);''',
              '''  const [archiveState, setArchiveState] = useState<SaveState>("idle");
              const [parseState, setParseState] = useState<"idle" | "parsing" | "ready" | "applying" | "error">("idle");
              const [parsePreview, setParsePreview] = useState<GenerationBriefParseResponse | null>(null);
              const [parseError, setParseError] = useState<string | null>(null);
              const [referenceAssetIdsTextTouched, setReferenceAssetIdsTextTouched] = useState(false);''',
          )
          replace(
              panel,
              '''  const handleNewConcept = () => {
          ''',
              '''  const handleAiParse = async () => {
              setParseState("parsing");
              setParseError(null);
              try {
                  const nextPreview = await parseGenerationBrief(
                      buildParseRequest(payload, effectiveDraft, referenceAssignments, activeTemplateId),
                  );
                  setParsePreview(nextPreview);
                  setParseState("ready");
              } catch {
                  setParsePreview(null);
                  setParseState("error");
                  setParseError("AI 需求解析失败，请检查 API 配置后重试。");
              }
          };

          const handleApplyAiParse = async () => {
              if (!parsePreview || parsePreview.changes.length === 0) {
                  setParsePreview(null);
                  setParseState("idle");
                  return;
              }
              setParseState("applying");
              setParseError(null);
              try {
                  const parsedUpdate = buildParsedUpdatePayload(
                      payload,
                      parsePreview.payload,
                      referenceAssignments,
                  );
                  if (Object.keys(parsedUpdate).length > 0) {
                      const updatedBrief = await onSave(parsedUpdate);
                      setDraft(createDraft(updatedBrief));
                      setReferenceAssetIdsTextTouched(false);
                  }
                  setParsePreview(null);
                  setParseState("idle");
                  setSaveState("saved");
              } catch {
                  setParseState("error");
                  setParseError("AI 解析结果应用失败，请稍后重试。");
              }
          };

          const handleNewConcept = () => {
          ''',
          )
          replace(
              panel,
              '''      <ConstructionBriefSummary payload={payload} />
              <SectionWorkspace''',
              '''      <ConstructionBriefSummary payload={payload} />
              <AiBriefParserPanel
                  currentTrace={readParserTrace(payload)}
                  error={parseError}
                  onApply={() => {
                      void handleApplyAiParse();
                  }}
                  onDismiss={() => {
                      setParsePreview(null);
                      setParseError(null);
                      setParseState("idle");
                  }}
                  onParse={() => {
                      void handleAiParse();
                  }}
                  preview={parsePreview}
                  state={parseState}
              />
              <SectionWorkspace''',
          )
          component_marker = '''function SectionWorkspace({
          '''
          parser_component = '''function AiBriefParserPanel({
              currentTrace,
              error,
              onApply,
              onDismiss,
              onParse,
              preview,
              state,
          }: {
              currentTrace: Record<string, unknown> | null;
              error: string | null;
              onApply: () => void;
              onDismiss: () => void;
              onParse: () => void;
              preview: GenerationBriefParseResponse | null;
              state: "idle" | "parsing" | "ready" | "applying" | "error";
          }) {
              const trace = preview?.trace ?? currentTrace;
              const status = typeof trace?.status === "string" ? trace.status : "succeeded";
              const provider = typeof trace?.provider === "string" ? trace.provider : "deterministic";
              const model = typeof trace?.model === "string" ? trace.model : null;
              const fallbackReason =
                  typeof trace?.fallback_reason === "string" ? trace.fallback_reason : null;

              return (
                  <section className="grid gap-3 rounded-md border border-border bg-card p-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                          <div>
                              <h3 className="text-sm font-semibold">AI 需求解析</h3>
                              <p className="mt-1 text-xs text-secondary-foreground">
                                  AI 只补全结构化 brief；应用前可以查看字段变化。
                              </p>
                          </div>
                          <Badge variant={status === "fallback" ? "warning" : "muted"}>
                              {status === "fallback" ? "基础解析回退" : `${provider}${model ? ` · ${model}` : ""}`}
                          </Badge>
                      </div>
                      <Button disabled={state === "parsing" || state === "applying"} onClick={onParse} type="button" variant="outline">
                          {state === "parsing" ? (
                              <Loader2 aria-hidden="true" className="h-4 w-4 animate-spin" />
                          ) : (
                              <Sparkles aria-hidden="true" className="h-4 w-4" />
                          )}
                          AI 解析需求
                      </Button>
                      {fallbackReason ? (
                          <p className="text-xs text-warning">回退原因：{fallbackReason}</p>
                      ) : null}
                      {preview ? (
                          <div className="grid gap-2 rounded-md border border-border bg-muted p-3">
                              <div className="flex items-center justify-between gap-2">
                                  <span className="text-sm font-medium">待确认字段变化</span>
                                  <Badge variant={preview.changes.length > 0 ? "primary" : "muted"}>
                                      {preview.changes.length} 项
                                  </Badge>
                              </div>
                              {preview.changes.length > 0 ? (
                                  <ul className="grid gap-2 text-xs">
                                      {preview.changes.map((change) => (
                                          <li className="rounded border border-border bg-background p-2" key={change.field}>
                                              <span className="font-medium">{change.field}</span>
                                              <span className="mt-1 block text-secondary-foreground">
                                                  {formatParserValue(change.before)} → {formatParserValue(change.after)}
                                              </span>
                                          </li>
                                      ))}
                                  </ul>
                              ) : (
                                  <p className="text-xs text-secondary-foreground">AI 没有提出新的字段调整。</p>
                              )}
                              <div className="flex flex-wrap gap-2">
                                  <Button disabled={state === "applying" || preview.changes.length === 0} onClick={onApply} size="sm" type="button">
                                      {state === "applying" ? <Loader2 aria-hidden="true" className="h-4 w-4 animate-spin" /> : null}
                                      应用解析结果
                                  </Button>
                                  <Button onClick={onDismiss} size="sm" type="button" variant="outline">
                                      取消
                                  </Button>
                              </div>
                          </div>
                      ) : null}
                      {error ? <p className="text-xs font-medium text-destructive" role="alert">{error}</p> : null}
                  </section>
              );
          }

          function formatParserValue(value: unknown): string {
              if (Array.isArray(value)) {
                  return value.join("、") || "空";
              }
              if (value === null || value === undefined || value === "") {
                  return "空";
              }
              if (typeof value === "object") {
                  return JSON.stringify(value);
              }
              return String(value);
          }

          ''' + component_marker
          replace(panel, component_marker, parser_component)
          helper_marker = '''function buildUpdatePayload(
          '''
          parse_helpers = '''function buildParseRequest(
              payload: Partial<GenerationBriefPayload>,
              draft: ParameterDraft,
              referenceAssignments: ReferenceUsageDraft[],
              activeTemplateId: string,
          ): GenerationBriefParseRequest {
              const references = buildReferenceUsagePayload(referenceAssignments);
              return {
                  allow_fallback: true,
                  character_focus: optionalText(draft.characterFocus),
                  character_theme: optionalText(draft.characterTheme),
                  color_harmony: optionalText(draft.colorHarmony),
                  coverage: optionalText(draft.coverage),
                  original_request: readString(payload, "original_request"),
                  overlay_logo_asset_ids: splitList(draft.overlayLogoAssetIdsText),
                  palette: splitList(draft.paletteText),
                  parser_mode: "ai",
                  racing_cues: splitList(draft.racingCuesText),
                  reference_asset_ids: references.reference_asset_ids ?? splitList(draft.referenceAssetIdsText),
                  reference_usage: references.reference_usage,
                  style: optionalText(draft.style),
                  supporting_graphics: splitList(draft.supportingGraphicsText),
                  text: splitList(draft.textText),
                  typography_intent: optionalText(draft.typographyIntent),
                  vehicle_template_id: activeTemplateId,
                  view: readString(payload, "view") || "side",
              };
          }

          function buildParsedUpdatePayload(
              current: Partial<GenerationBriefPayload>,
              parsed: GenerationBriefPayload,
              referenceAssignments: ReferenceUsageDraft[],
          ): GenerationBriefUpdateRequest {
              return buildUpdatePayload(
                  current,
                  createDraftFromPayload(parsed, readStringArray(current, "reference_asset_ids")),
                  referenceAssignments,
              );
          }

          function optionalText(value: string): string | undefined {
              const normalized = value.trim();
              return normalized || undefined;
          }

          ''' + helper_marker
          replace(panel, helper_marker, parse_helpers)
          replace(
              panel,
              '''  const payload = brief ? readPayload(brief) : {};
              const referenceAssetIds =''',
              '''  const payload = brief ? readPayload(brief) : {};
              return createDraftFromPayload(payload, selectedReferenceAssetIds);
          }

          function createDraftFromPayload(
              payload: Partial<GenerationBriefPayload>,
              selectedReferenceAssetIds: string[] = [],
          ): ParameterDraft {
              const referenceAssetIds =''',
          )
          replace(
              panel,
              '''  return {
                  characterFocus: readString(payload, "character_focus"),''',
              '''  return {
                  characterFocus: readString(payload, "character_focus"),''',
          )
          replace(
              panel,
              '''function findTemplate(
          ''',
              '''function readParserTrace(payload: Record<string, unknown>): Record<string, unknown> | null {
              const trace = payload.parser_trace;
              return isRecord(trace) ? trace : null;
          }

          function findTemplate(
          ''',
          )

          api_tests = Path("services/api/tests/test_generation.py")
          api_test_text = api_tests.read_text(encoding="utf-8")
          api_test_text += '''

          def test_parse_generation_brief_preview_returns_trace_and_changes(tmp_path: Path) -> None:
              settings = api_settings(
                  tmp_path,
                  ai_brief_parser_provider="deterministic",
                  ai_provider_calls_enabled=True,
                  ai_provider_openai_api_key=SecretStr("openai-secret"),
                  ai_provider_openai_text_model="gpt-5.5",
              )
              client, app, _queue = create_generation_client(tmp_path, settings=settings)

              def handler(_request: httpx.Request) -> httpx.Response:
                  return httpx.Response(
                      200,
                      json={
                          "output": [
                              {
                                  "content": [
                                      {
                                          "text": json.dumps(
                                              {
                                                  "character_theme": "Miku racing heroine",
                                                  "coverage": "full side coverage",
                                                  "original_request": "白色双门车，初音未来主题。",
                                                  "palette": ["white", "cyan", "black"],
                                                  "style": "clean racing itasha",
                                              },
                                          ),
                                      },
                                  ],
                              },
                          ],
                      },
                  )

              parser_client = httpx.AsyncClient(
                  base_url="https://api.openai.test/v1",
                  transport=httpx.MockTransport(handler),
              )
              app.state.openai_brief_parser_client = parser_client
              try:
                  response = client.post(
                      "/generation/briefs/parse",
                      json={
                          "allow_fallback": True,
                          "original_request": "白色双门车，初音未来主题。",
                          "parser_mode": "ai",
                      },
                  )
              finally:
                  asyncio.run(parser_client.aclose())

              assert response.status_code == 200
              body = response.json()
              assert body["trace"] == body["payload"]["parser_trace"]
              assert body["trace"]["provider"] == "openai"
              assert body["trace"]["model"] == "gpt-5.5"
              assert body["trace"]["status"] == "succeeded"
              assert {change["field"] for change in body["changes"]} >= {
                  "character_theme",
                  "coverage",
                  "palette",
                  "style",
              }


          def test_create_generation_brief_falls_back_when_ai_parser_fails(tmp_path: Path) -> None:
              settings = api_settings(
                  tmp_path,
                  ai_brief_parser_fallback_enabled=True,
                  ai_brief_parser_provider="openai",
                  ai_provider_calls_enabled=True,
                  ai_provider_openai_api_key=SecretStr("openai-secret"),
              )
              client, app, _queue = create_generation_client(tmp_path, settings=settings)
              workspace_id = client.post("/workspaces", json={"title": "Fallback"}).json()["id"]

              parser_client = httpx.AsyncClient(
                  base_url="https://api.openai.test/v1",
                  transport=httpx.MockTransport(lambda _request: httpx.Response(503, text="down")),
              )
              app.state.openai_brief_parser_client = parser_client
              try:
                  response = client.post(
                      f"/workspaces/{workspace_id}/generation/briefs",
                      json={"original_request": "White coupe with a cyan heroine."},
                  )
              finally:
                  asyncio.run(parser_client.aclose())

              assert response.status_code == 201
              trace = response.json()["payload"]["parser_trace"]
              assert trace["requested_mode"] == "ai"
              assert trace["provider"] == "deterministic"
              assert trace["status"] == "fallback"
              assert "503" in trace["fallback_reason"]
              assert "openai-secret" not in response.text
          '''
          api_tests.write_text(api_test_text, encoding="utf-8")

          web_test = "apps/web/src/lib/api/generation.test.ts"
          replace(
              web_test,
              '''  createGenerationBrief,
              loadGenerationState,''',
              '''  createGenerationBrief,
              loadGenerationState,
              parseGenerationBrief,''',
          )
          test_target = Path(web_test)
          test_text = test_target.read_text(encoding="utf-8")
          insert_before = '\n  it("builds structured reference usage while preserving legacy IDs", () => {'
          parser_test = '''
              it("requests an AI brief parsing preview", async () => {
                  const fetcher = vi.fn(async (_input: RequestInfo | URL, init?: RequestInit) =>
                      jsonResponse({
                          changes: [
                              { field: "style", before: "itasha concept", after: "clean racing itasha" },
                          ],
                          payload: {
                              ...briefFixture.payload,
                              parser_trace: {
                                  fallback_reason: null,
                                  model: "gpt-5.5",
                                  provider: "openai",
                                  requested_mode: "ai",
                                  schema_version: 1,
                                  status: "succeeded",
                              },
                              style: "clean racing itasha",
                          },
                          trace: {
                              fallback_reason: null,
                              model: "gpt-5.5",
                              provider: "openai",
                              requested_mode: "ai",
                              schema_version: 1,
                              status: "succeeded",
                          },
                      }),
                  );

                  const result = await parseGenerationBrief(
                      { allow_fallback: true, original_request: "Miku coupe", parser_mode: "ai" },
                      { apiBaseUrl: "https://api.test", fetch: fetcher },
                  );

                  expect(fetcher).toHaveBeenCalledWith(
                      "https://api.test/generation/briefs/parse",
                      expect.objectContaining({ method: "POST" }),
                  );
                  expect(result.trace.provider).toBe("openai");
                  expect(result.changes).toHaveLength(1);
              });
          ''' + insert_before
          if insert_before not in test_text:
              raise SystemExit("generation wrapper test insertion point missing")
          test_target.write_text(test_text.replace(insert_before, parser_test, 1), encoding="utf-8")

          for env_path in (".env.example", "services/api/.env.example"):
              target = Path(env_path)
              text = target.read_text(encoding="utf-8")
              marker = "AI_BRIEF_PARSER_PROVIDER=deterministic\n"
              if "AI_BRIEF_PARSER_FALLBACK_ENABLED" not in text:
                  text = text.replace(marker, marker + "AI_BRIEF_PARSER_FALLBACK_ENABLED=true\n", 1)
              target.write_text(text, encoding="utf-8")

          for temporary in (
              ".github/workflows/source-snapshot.yml",
              ".github/workflows/apply-ai-parser-ux.yml",
          ):
              path = Path(temporary)
              if path.exists():
                  path.unlink()

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.0.8 --activate
          pnpm install --frozen-lockfile
          (cd services/core && uv sync --dev --locked)
          (cd services/api && uv sync --dev --locked)
          (cd services/worker && uv sync --dev --locked)

      - name: Refresh contracts
        run: pnpm contracts:generate

      - name: Validate repository
        run: pnpm validate

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add AI brief parser UX and fallback trace"
          git push
